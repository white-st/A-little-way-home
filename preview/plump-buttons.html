<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索新道路 · 饱满圆角按钮</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e0e8d4;color:#29482e;font:14px system-ui;display:flex;justify-content:center;align-items:center;gap:28px;min-height:100vh;padding:16px}canvas{display:block;width:375px;height:680px;max-width:92vw;touch-action:none;border-radius:18px;box-shadow:0 12px 50px #29482e20}aside{width:240px}h1{font-size:24px}p{color:#617654;line-height:1.8}button{width:100%;padding:12px;margin:4px 0;border:1px solid #b8cfa5;border-radius:10px;background:#f6faed;color:#29482e;cursor:pointer}@media(max-width:650px){body{flex-direction:column}aside{width:min(375px,92vw)}}
</style>
<canvas id="game" aria-label="探索新道路：饱满圆角按钮"></canvas>
<aside><h1>饱满圆角，留白更舒展</h1><p>更醒目的白色包边、更饱满的圆角与柔和高光。首页只保留两个模式入口，底部导航更轻巧，间距更舒展。</p><label>模拟版本 <select id="environment"><option value="develop">开发版</option><option value="trial">体验版</option><option value="release">正式版（无测试按钮）</option></select></label><button id="restart">关闭游戏并重新进入</button><button id="compact">紧凑手机视窗</button><button id="hold">演示按住按钮</button><p id="status" role="status"></p><p>此页使用独立的浏览器测试存档，不影响手机微信中的记录。</p></aside>
<script src="/miniprogram/core/levels.js"></script><script src="/miniprogram/core/engine.js"></script><script src="/miniprogram/core/session.js"></script><script src="/miniprogram/core/profile.js"></script><script src="/miniprogram/core/classic.js"></script><script src="/miniprogram/core/motion.js"></script><script src="/miniprogram/core/animals.js"></script><script src="/miniprogram/core/homecoming.js"></script><script src="/miniprogram/core/renderer.js"></script><script src="/miniprogram/core/sound.js"></script><script src="/miniprogram/core/music.js"></script><script src="/preview/sound-player.js"></script><script src="/preview/minigame-platform.js"></script><script src="/minigame/src/view.js"></script><script src="/minigame/src/application.js"></script>
<script>
const canvas=document.getElementById('game'),platform=createMinigamePreviewPlatform(canvas),prefix='plump-buttons-0.9.9:';
platform.getStorageSync=key=>JSON.parse(localStorage.getItem(prefix+key));
platform.setStorageSync=(key,value)=>localStorage.setItem(prefix+key,JSON.stringify(value));
let app, demoFinger=null;
function start(){
  demoFinger=null;document.getElementById('hold').textContent='演示按住按钮';
  if(app)app.destroy();
  platform.getAccountInfoSync=()=>({miniProgram:{envVersion:document.getElementById('environment').value}});
  app=new LumenGame.GameApp(platform,{request:cb=>requestAnimationFrame(cb),cancel:id=>cancelAnimationFrame(id)});
  app.start();
}
document.getElementById('restart').onclick=start;
document.getElementById('compact').onclick=()=>{canvas.style.width='320px';canvas.style.height='568px';app.resize();};
document.getElementById('environment').onchange=start;
document.getElementById('hold').onclick=()=>{
  if(demoFinger) {
    app.touchEnd({touches:[],changedTouches:[demoFinger]});demoFinger=null;
    document.getElementById('hold').textContent='演示按住按钮';
  } else {
    const target=app.layout.targets.find(t=>t.id==='hint')||app.layout.targets.find(t=>!t.disabled&&t.kind!=='slider');
    if(!target)return;
    demoFinger={identifier:991,clientX:(target.x+target.w/2)*app.scale+app.offsetX,clientY:(target.y+target.h/2)*app.scale};
    app.touchStart({touches:[demoFinger]});document.getElementById('hold').textContent='松开，观察回弹';
  }
};
const ticker=setInterval(()=>{
  const view=app.campaign.view();document.getElementById('status').textContent=`已完成 ${view.overallCompleted} 关 · ${view.totalHearts} 颗星 · 黑夜模式${app.profile.data.nightMode?'开启':'关闭'}`;
},200);
start();window.addEventListener('pagehide',()=>{clearInterval(ticker);app.destroy();});
</script></html>
